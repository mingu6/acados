# conda env create -f environment.yml && conda activate quadruped-filterddp
# then install acados_template and Quadruped-PyMPC as in README.md
name: quadruped-filterddp
channels:
  - conda-forge
dependencies:
  - python =3.12
  - pip
  - pip:
      - casadi==3.8.1
      - numpy
      - scipy
      - matplotlib
      - cython
      - Deprecated
      - mujoco==3.14.0
      - gymnasium==1.3.0
      - gym-quadruped==1.1.6
      - imageio
      - imageio-ffmpeg
      - pillow
